services:
  postgres:
    image: postgres:16
    container_name: nbd-postgres
    environment:
      POSTGRES_USER: nbd
      POSTGRES_PASSWORD: nbdpassword
      POSTGRES_DB: nbd
    ports:
      - "5433:5432"
    volumes:
      - nbd-pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbd -d nbd"]
      interval: 5s
      timeout: 3s
      retries: 10
  mongo1:
    image: mongo:7
    container_name: nbd-mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    network_mode: host
    healthcheck:
      test: >
        mongosh --port 27017 --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0', members:[
        {_id:0, host:'localhost:27017', priority:2},
        {_id:1, host:'localhost:27018'},
        {_id:2, host:'localhost:27019'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10

  mongo2:
    image: mongo:7
    container_name: nbd-mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    network_mode: host

  mongo3:
    image: mongo:7
    container_name: nbd-mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    network_mode: host
volumes:
  nbd-pgdata:
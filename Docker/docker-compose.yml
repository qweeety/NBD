services:
  postgres:
    image: postgres:16
    container_name: nbd-postgres
    environment:
      POSTGRES_USER: nbd
      POSTGRES_PASSWORD: nbdpassword
      POSTGRES_DB: nbd
    ports:
      - "5433:5432"
    volumes:
      - nbd-pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbd -d nbd"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nbd-pgdata: